apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-learn-webapp
  labels:
    app: aks-learn-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aks-learn-webapp
  template:
    metadata:
      labels:
        app: aks-learn-webapp
    spec:
      containers:
      - name: webapp
        image: ${WEBAPP_IMAGE}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: MCP_SERVER_URL
          value: "${MCP_SERVER_URL}"
        - name: MCP_TOOL_NAME
          value: ""
        - name: MCP_TOOL_QUERY_PARAM
          value: "query"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
